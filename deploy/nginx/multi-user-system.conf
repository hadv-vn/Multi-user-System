# Reverse proxy cho cụm backend Multi-User System.
#
# Cổng công khai: 8080 (mở firewall). Các instance backend lắng nghe ở
# 127.0.0.1:8081-8089 (KHÔNG mở firewall), khởi động bằng
# scripts/run-all.sh.
#
# Liệt kê sẵn đủ 9 slot: slot nào không chạy thì kết nối bị từ chối ngay,
# nginx tự chuyển sang instance kế tiếp (request chưa được gửi đi nên an
# toàn cả với POST) và tạm bỏ qua slot đó trong `fail_timeout`.
#
# Cài đặt (Ubuntu/Debian):
#   sudo cp deploy/nginx/multi-user-system.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx

upstream multi_user_system_backend {
  least_conn;
  server 127.0.0.1:8081 max_fails=1 fail_timeout=10s;
  server 127.0.0.1:8082 max_fails=1 fail_timeout=10s;
  server 127.0.0.1:8083 max_fails=1 fail_timeout=10s;
  server 127.0.0.1:8084 max_fails=1 fail_timeout=10s;
  server 127.0.0.1:8085 max_fails=1 fail_timeout=10s;
  server 127.0.0.1:8086 max_fails=1 fail_timeout=10s;
  server 127.0.0.1:8087 max_fails=1 fail_timeout=10s;
  server 127.0.0.1:8088 max_fails=1 fail_timeout=10s;
  server 127.0.0.1:8089 max_fails=1 fail_timeout=10s;
  keepalive 32;
}

server {
  listen 8080;
  server_name _;

  location / {
    proxy_pass http://multi_user_system_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Ghi đè (không nối thêm) để client không giả mạo được IP; backend đọc
    # giá trị này nhờ TRUST_PROXY=loopback.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_next_upstream error timeout;
    proxy_connect_timeout 2s;
  }
}
