name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test-build:
    name: lint, unit test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8081/api/v1

  e2e:
    name: backend e2e (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: multi_user_system
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/multi_user_system?schema=public
      PORT: 8081
      CORS_ORIGIN: http://localhost:8080
      APP_BASE_URL: http://localhost:8080
      BCRYPT_SALT_ROUNDS: 4
      SESSION_COOKIE_NAME: sid
      SESSION_COOKIE_SAME_SITE: lax
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_USER: ''
      SMTP_PASSWORD: ''
      SMTP_FROM_ADDRESS: no-reply@multi-user-system.local
      CSRF_SECRET: ci-only-csrf-secret-not-used-anywhere-else-0000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate --workspace=backend
      - run: npm run db:seed --workspace=backend
      - run: npm run test:e2e --workspace=backend

  docker:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare compose env
        run: |
          cp .env.docker.example .env
          sed -i "s/^CSRF_SECRET=.*/CSRF_SECRET=$(openssl rand -hex 32)/" .env
          sed -i "s/^SEED_ADMIN_PASSWORD=.*/SEED_ADMIN_PASSWORD=CiAdmin12345/" .env
      - run: docker compose build
      - run: docker compose up -d
      - name: Wait for backend and frontend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8081/health && curl -fsS -o /dev/null http://localhost:8080/login; then
              echo "stack is up"; exit 0
            fi
            sleep 2
          done
          echo "stack did not become healthy" >&2
          exit 1
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
